<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Key Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #ccc; font-family: monospace; font-size: 11px; }
    #title { color: #9bbc0f; font-weight: bold; text-align: center; padding: 6px 0 2px; }
    #hint { color: #888; font-size: 9px; text-align: center; padding-bottom: 6px; }
    #now { margin: 0 8px 6px; padding: 6px; border: 1px solid #9bbc0f; min-height: 52px; white-space: pre-line; color: #fff; }
    #log { margin: 0 8px; white-space: pre-line; color: #aaa; font-size: 10px; line-height: 1.3; }
  </style>
</head>
<body>
  <div id="title">KEY TEST</div>
  <div id="hint">Press any key (green, red, soft keys, back, D-pad...)</div>
  <div id="now">Waiting for a key...</div>
  <div id="log"></div>
  <script>
    var nowEl = document.getElementById("now");
    var logEl = document.getElementById("log");
    var lines = [];

    function describe(e) {
      return e.type + "  key=" + e.key + "  code=" + e.code + "  keyCode=" + e.keyCode + "  which=" + e.which;
    }

    function show(e) {
      var text = describe(e);
      nowEl.textContent = text.replace(/  /g, "\n");
      lines.unshift(e.type.charAt(3) === "d" ? "DOWN " + e.key + " (" + e.keyCode + ")" : "up   " + e.key + " (" + e.keyCode + ")");
      if (lines.length > 12) lines.length = 12;
      logEl.textContent = lines.join("\n");
    }

    function handler(e) {
      try { e.preventDefault(); } catch (x) {}
      show(e);
    }

    window.addEventListener("keydown", handler, true);
    window.addEventListener("keyup", handler, true);
  </script>
</body>
</html>
