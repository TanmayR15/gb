<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pokemon Red</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      color: #0f0;
      font-family: monospace;
      text-align: center;
    }
    canvas {
      width: 240px;
      height: 216px;
      display: block;
      margin: 10px auto 6px;
      background: #9bbc0f;
      image-rendering: -moz-crisp-edges;
      outline: none;
    }
    #bar { font-size: 10px; color: #aaa; line-height: 1.4; padding: 0 4px; }
    body.fs canvas {
      width: 100vw;
      height: 100vh;
      margin: 0;
    }
    body.fs #bar {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gb" width="160" height="144" tabindex="0"></canvas>
  <div id="bar">Loading rom.gb...</div>

  <script>
    var canvas = document.getElementById("gb");
    window.settings = [false, false, false, 1, true, false, 8, 10, 20, false, false, false, false, true, [true, true, true, true]];
    window.cout = function () {};
    window.pause = function () {};
    window.initNewCanvas = function () { return canvas; };
  </script>
  <script src="js/other/base64.js"></script>
  <script src="js/other/resampler.js"></script>
  <script src="js/other/XAudioServer.js"></script>
  <script src="js/GameBoyCore.js"></script>
  <script src="js/GameBoyIO.js"></script>
  <script>
    var gb = null;
    var bar = document.getElementById("bar");
    var defaultBar = "2/4/6/8: Move | 1: A | 3: B<br>0: Start | 9: Select | *: Save";

    // GameBoyCore JoyPadEvent codes:
    // 0 = Right, 1 = Left, 2 = Up, 3 = Down, 4 = A, 5 = B, 6 = Select, 7 = Start
    var keyCodeMap = {
      39: 0, 54: 0, // ArrowRight or 6 -> Right
      37: 1, 52: 1, // ArrowLeft  or 4 -> Left
      38: 2, 50: 2, // ArrowUp    or 2 -> Up
      40: 3, 56: 3, // ArrowDown  or 8 -> Down
      49: 4, 13: 4, // 1 or Enter      -> A
      51: 5,        // 3               -> B
      57: 6,        // 9               -> Select
      48: 7         // 0               -> Start
    };

    function mapKey(e) {
      if (e.key === "ArrowRight" || e.key === "Right" || e.key === "6") return 0;
      if (e.key === "ArrowLeft"  || e.key === "Left"  || e.key === "4") return 1;
      if (e.key === "ArrowUp"    || e.key === "Up"    || e.key === "2") return 2;
      if (e.key === "ArrowDown"  || e.key === "Down"  || e.key === "8") return 3;
      if (e.key === "1" || e.key === "Enter") return 4;
      if (e.key === "3") return 5;
      if (e.key === "9") return 6;
      if (e.key === "0") return 7;
      if (keyCodeMap.hasOwnProperty(e.keyCode)) return keyCodeMap[e.keyCode];
      return -1;
    }

    function lockFocus() {
      if (canvas && typeof canvas.focus === "function") {
        try { canvas.focus(); } catch (e) {}
      }
    }

    function isFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.mozFullScreenElement ||
        document.webkitFullscreenElement ||
        document.body.classList.contains("fs")
      );
    }

    function toggleFullscreen() {
      var el = document.documentElement;
      if (!isFullscreen()) {
        document.body.classList.add("fs");
        var req = el.requestFullscreen || el.mozRequestFullScreen || el.webkitRequestFullscreen;
        if (req) {
          try { req.call(el); } catch (err) {}
        }
      } else {
        document.body.classList.remove("fs");
        var exit = document.exitFullscreen || document.mozCancelFullScreen || document.webkitExitFullscreen;
        if (exit) {
          try { exit.call(document); } catch (err) {}
        }
      }
      lockFocus();
    }

    document.addEventListener("fullscreenchange", function () {
      document.body.classList.toggle("fs", isFullscreen());
    });
    document.addEventListener("mozfullscreenchange", function () {
      document.body.classList.toggle("fs", isFullscreen());
    });

    function tickFrame() {
      if (!gb) return;
      gb.stopEmulator = 0;
      if (typeof gb.executeIteration === "function") {
        gb.emulatorTicks = 0;
        gb.CPUCyclesTotal = 70224;
        gb.executeIteration();
      }
      if (typeof gb.run === "function") gb.run();
      if (typeof gb.requestDraw === "function") gb.requestDraw();
    }

    function bootEmulator(romBinary) {
      try {
        gb = new GameBoyCore(canvas, romBinary);
        gb.start();
        if (typeof gb.stopSound === "function") gb.stopSound();
        loadSave();
        tickFrame();
        lockFocus();
        bar.innerHTML = defaultBar;
        setInterval(tickFrame, 16);
      } catch (err) {
        bar.innerHTML = "BOOT ERR: " + err.message;
      }
    }

    function loadROM() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "rom.gb?t=" + Date.now(), true);
      xhr.responseType = "arraybuffer";
      xhr.onload = function () {
        if (xhr.status !== 200 || !xhr.response) {
          bar.innerHTML = "HTTP " + xhr.status + " loading rom.gb";
          return;
        }
        var bytes = new Uint8Array(xhr.response);
        if (bytes.length < 1024) {
          bar.innerHTML = "BAD ROM SIZE: " + bytes.length + " bytes";
          return;
        }
        var chunks = [];
        for (var i = 0; i < bytes.length; i++) {
          chunks.push(String.fromCharCode(bytes[i]));
        }
        bootEmulator(chunks.join(""));
      };
      xhr.onerror = function () {
        bar.innerHTML = "XHR ERROR loading rom.gb";
      };
      xhr.send();
    }

    function saveGame() {
      if (!gb) return;
      try {
        var sram = gb.saveSRAMState();
        localStorage.setItem("pkmn_red_sram", JSON.stringify(sram));
        bar.innerHTML = "SAVED TO BROWSER!";
        setTimeout(function () { bar.innerHTML = defaultBar; }, 2000);
      } catch (e) {}
    }

    function loadSave() {
      try {
        var saved = localStorage.getItem("pkmn_red_sram");
        if (saved && gb && typeof gb.openSRAM === "function") {
          gb.openSRAM(JSON.parse(saved));
        }
      } catch (e) {}
    }

    window.addEventListener("keydown", function (e) {
      lockFocus();
      if (e.key === "7" || e.keyCode === 55 || e.keyCode === 103) {
        toggleFullscreen();
        e.preventDefault();
        return;
      }
      if (e.key === "*") {
        saveGame();
        e.preventDefault();
        return;
      }
      var btn = mapKey(e);
      if (btn !== -1) {
        if (gb) gb.JoyPadEvent(btn, true);
        e.preventDefault();
      }
    }, true);

    window.addEventListener("keyup", function (e) {
      if (e.key === "7" || e.keyCode === 55 || e.keyCode === 103) {
        e.preventDefault();
        return;
      }
      var btn = mapKey(e);
      if (btn !== -1) {
        if (gb) gb.JoyPadEvent(btn, false);
        e.preventDefault();
      }
    }, true);

    loadROM();
  </script>
</body>
</html>
