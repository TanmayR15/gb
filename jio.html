<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokemon Red</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #000;
      color: #ccc;
      font-family: monospace;
      text-align: center;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      background: #9bbc0f;
      image-rendering: -moz-crisp-edges;
      image-rendering: pixelated;
      width: 240px;
      height: 216px;
      outline: none;
    }
    #bar {
      margin-top: 6px;
      font-size: 10px;
      line-height: 1.3;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="gb" width="160" height="144" tabindex="0"></canvas>
    <div id="bar">Loading rom.gb...</div>
  </div>

  <script src="js/other/terminal.js"></script>
  <script src="js/other/base64.js"></script>
  <script src="js/other/swfobject.js"></script>
  <script src="js/other/resampler.js"></script>
  <script src="js/other/XAudioServer.js"></script>
  <script src="js/other/resize.js"></script>
  <script src="js/GameBoyCore.js"></script>
  <script src="js/GameBoyIO.js"></script>
  <script>
    var canvas = document.getElementById("gb");
    var bar = document.getElementById("bar");
    var gb = null;
    var SAVE_KEY = "pkmn_red_sram";
    var defaultBar = "2/4/6/8: Move | 1: A | 3: B<br>0: Start | 9: Select | 7: Full | *: Save";

    function lockFocus() {
      try { window.focus(); canvas.focus(); } catch (e) {}
    }

    function saveGame(silent) {
      try {
        if (!gb) return;
        var data = null;
        if (gb.MBCRam && gb.MBCRam.length) {
          data = Array.prototype.slice.call(gb.MBCRam);
        } else if (typeof gb.saveSRAMState === "function") {
          data = gb.saveSRAMState();
        }
        if (data && data.length) {
          localStorage.setItem(SAVE_KEY, JSON.stringify(data));
          if (!silent) {
            bar.innerHTML = "SAVED TO BROWSER!";
            setTimeout(function () { bar.innerHTML = defaultBar; }, 1500);
          }
        }
      } catch (e) {
        if (!silent) bar.innerHTML = "SAVE ERR: " + e.message;
      }
    }

    function loadSave() {
      try {
        var saved = localStorage.getItem(SAVE_KEY);
        if (!saved || !gb || !gb.MBCRam) return;
        var parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          for (var i = 0; i < parsed.length && i < gb.MBCRam.length; i++) {
            gb.MBCRam[i] = Number(parsed[i]) & 0xff;
          }
          gb.MBCRAMBanksEnabled = true;
        }
      } catch (e) {}
    }

    function tickFrame() {
      if (!gb) return;
      gb.stopEmulator &= 1;
      gb.iterations = 0;
      gb.run();
    }

    function toggleFullscreen() {
      var el = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      }
    }

    function bootEmulator(romBinary) {
      try {
        gb = new GameBoyCore(canvas, romBinary);
        gb.start();
        if (typeof gb.stopSound === "function") gb.stopSound();
        loadSave();
        bar.innerHTML = defaultBar;
        lockFocus();
        setTimeout(function () {
          tickFrame();
          setInterval(tickFrame, 33);
          setInterval(function () { saveGame(true); }, 30000);
        }, 50);
      } catch (err) {
        bar.innerHTML = "BOOT ERR: " + err.message;
      }
    }

    function loadROM() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "rom.gb", true);
      xhr.overrideMimeType("text/plain; charset=x-user-defined");
      xhr.onload = function () {
        if (xhr.status === 200 || xhr.status === 0) {
          var raw = xhr.responseText;
          var bin = "";
          for (var i = 0; i < raw.length; i++) {
            bin += String.fromCharCode(raw.charCodeAt(i) & 0xff);
          }
          bar.innerHTML = "Starting emulator...";
          setTimeout(function () { bootEmulator(bin); }, 50);
        } else {
          bar.innerHTML = "ROM ERR: HTTP " + xhr.status;
        }
      };
      xhr.onerror = function () {
        bar.innerHTML = "ROM NETWORK ERROR";
      };
      xhr.send(null);
    }

    var keyMap = {
      "6": 0, "ArrowRight": 0,
      "4": 1, "ArrowLeft": 1,
      "2": 2, "ArrowUp": 2,
      "8": 3, "ArrowDown": 3,
      "1": 4, "Enter": 4,
      "3": 5,
      "9": 6,
      "0": 7
    };

    var keyCodeMap = {
      39: 0, 54: 0, 102: 0,
      37: 1, 52: 1, 100: 1,
      38: 2, 50: 2, 104: 2,
      40: 3, 56: 3, 98: 3,
      49: 4, 13: 4, 97: 4, 35: 4,
      51: 5, 99: 5, 34: 5,
      57: 6, 105: 6,
      48: 7, 96: 7
    };

    function resolveBtn(e) {
      if (e.key && keyMap.hasOwnProperty(e.key)) return keyMap[e.key];
      if (keyCodeMap.hasOwnProperty(e.keyCode)) return keyCodeMap[e.keyCode];
      return -1;
    }

    function handleKey(e, isDown) {
      if (!gb) return;
      if (e.key === "*" || e.keyCode === 42 || e.keyCode === 106) {
        e.preventDefault();
        if (isDown) saveGame(false);
        return;
      }
      if (e.key === "7" || e.keyCode === 55 || e.keyCode === 103) {
        e.preventDefault();
        if (isDown) toggleFullscreen();
        return;
      }
      var btn = resolveBtn(e);
      if (btn !== -1) {
        e.preventDefault();
        gb.JoyPadEvent(btn, isDown);
      }
    }

    window.addEventListener("keydown", function (e) { handleKey(e, true); }, false);
    window.addEventListener("keyup", function (e) { handleKey(e, false); }, false);
    canvas.addEventListener("click", lockFocus, false);

    window.onload = function () {
      lockFocus();
      setTimeout(loadROM, 50);
    };
  </script>
</body>
</html>
