<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pokemon Red</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #0f0; font-family: monospace; text-align: center; overflow: hidden; }
    canvas { width: 240px; height: 216px; display: block; margin: 10px auto 6px; background: #9bbc0f; image-rendering: -moz-crisp-edges; }
    #bar { font-size: 11px; color: #aaa; line-height: 1.4; padding: 0 6px; }
  </style>
</head>
<body>
  <canvas id="gb" width="160" height="144"></canvas>
  <div id="bar">Loading rom.gb...</div>

  <script>
    var canvas = document.getElementById("gb");
    window.settings = [false, false, false, 1, true, false, 8, 10, 20, false, false, false, false, true, [true, true, true, true]];
    window.cout = function () {};
    window.pause = function () {};
    window.initNewCanvas = function () { return canvas; };
  </script>
  <script src="js/other/base64.js"></script>
  <script src="js/other/resampler.js"></script>
  <script src="js/other/XAudioServer.js"></script>
  <script src="js/GameBoyCore.js"></script>
  <script src="js/GameBoyIO.js"></script>
  <script>
    var gb = null;
    var bar = document.getElementById("bar");

    var keyCodeMap = {
      39: 0, // Right
      37: 1, // Left
      38: 2, // Up
      40: 3, // Down
      53: 4, // 5 -> A
      13: 4, // Enter -> A
      56: 5, // 8 -> B
      48: 7  // 0 -> Start
    };

    function mapKey(e) {
      if (e.key === "ArrowRight" || e.key === "Right") return 0;
      if (e.key === "ArrowLeft"  || e.key === "Left")  return 1;
      if (e.key === "ArrowUp"    || e.key === "Up")    return 2;
      if (e.key === "ArrowDown"  || e.key === "Down")  return 3;
      if (e.key === "5") return 4;
      if (e.key === "Enter") return 4;
      if (e.key === "8") return 5;
      if (e.key === "#") return 6;
      if (e.key === "0") return 7;
      if (keyCodeMap.hasOwnProperty(e.keyCode)) return keyCodeMap[e.keyCode];
      return -1;
    }

    function tickFrame() {
      if (!gb) return;
      gb.stopEmulator = 0;
      if (typeof gb.executeIteration === "function") {
        gb.emulatorTicks = 0;
        gb.CPUCyclesTotal = 70224;
        gb.executeIteration();
      }
      if (typeof gb.run === "function") gb.run();
      if (typeof gb.requestDraw === "function") gb.requestDraw();
    }

    function bootEmulator(romBinary) {
      try {
        gb = new GameBoyCore(canvas, romBinary);
        gb.start();
        if (typeof gb.stopSound === "function") gb.stopSound();
        loadSave();
        tickFrame();
        bar.innerHTML = "D-Pad: Move | 5: A | 8: B<br>0: Start | #: Select | *: Save";
        setInterval(tickFrame, 16);
      } catch (err) {
        bar.innerHTML = "BOOT ERR: " + err.message;
      }
    }

    function loadROM() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "rom.gb?t=" + Date.now(), true);
      xhr.responseType = "arraybuffer";
      xhr.onload = function () {
        if (xhr.status !== 200 || !xhr.response) {
          bar.innerHTML = "HTTP " + xhr.status + " loading rom.gb";
          return;
        }
        var bytes = new Uint8Array(xhr.response);
        if (bytes.length < 1024) {
          bar.innerHTML = "BAD ROM SIZE: " + bytes.length + " bytes";
          return;
        }
        var chunks = [];
        for (var i = 0; i < bytes.length; i++) {
          chunks.push(String.fromCharCode(bytes[i]));
        }
        bootEmulator(chunks.join(""));
      };
      xhr.onerror = function () {
        bar.innerHTML = "XHR ERROR loading rom.gb";
      };
      xhr.send();
    }

    function saveGame() {
      if (!gb) return;
      try {
        var sram = gb.saveSRAMState();
        localStorage.setItem("pkmn_red_sram", JSON.stringify(sram));
        bar.innerHTML = "SAVED TO BROWSER!";
      } catch (e) {}
    }

    function loadSave() {
      try {
        var saved = localStorage.getItem("pkmn_red_sram");
        if (saved && gb && typeof gb.openSRAM === "function") {
          gb.openSRAM(JSON.parse(saved));
        }
      } catch (e) {}
    }

    window.addEventListener("keydown", function (e) {
      bar.innerHTML = "key=" + e.key + " | kc=" + e.keyCode;
      if (e.key === "*") {
        saveGame();
        e.preventDefault();
        return;
      }
      var btn = mapKey(e);
      if (btn !== -1) {
        if (gb) gb.JoyPadEvent(btn, true);
        e.preventDefault();
      }
    }, true);

    window.addEventListener("keyup", function (e) {
      var btn = mapKey(e);
      if (btn !== -1) {
        if (gb) gb.JoyPadEvent(btn, false);
        e.preventDefault();
      }
    }, true);

    loadROM();
  </script>
</body>
</html>
