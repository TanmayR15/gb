<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GB Launcher</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #000;
      color: #ccc;
      font-family: monospace;
      text-align: center;
    }
    #wrap {
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    #menu {
      width: 232px;
      background: #111;
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
      font-size: 11px;
    }
    #menu-title {
      color: #9bbc0f;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }
    #game-list {
      max-height: 190px;
      overflow: hidden;
    }
    .game-item {
      padding: 5px 6px;
      margin: 3px 0;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .game-item.active {
      background: #9bbc0f;
      color: #000;
      font-weight: bold;
      border-color: #9bbc0f;
    }
    .game-item.missing { opacity: 0.45; }
    .tag {
      font-size: 9px;
      opacity: 0.8;
    }
    #menu-hint {
      margin-top: 6px;
      font-size: 9px;
      color: #888;
      text-align: center;
    }
    #settings {
      display: none;
      width: 232px;
      background: #111;
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
      font-size: 10px;
    }
    #settings label { display: block; margin-top: 5px; color: #9bbc0f; }
    #settings input {
      width: 100%;
      box-sizing: border-box;
      background: #000;
      color: #eee;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 11px;
      padding: 3px;
      margin-top: 2px;
    }
    #settings input:focus, #settings .btn:focus { outline: 2px solid #9bbc0f; }
    #settings .btn {
      margin-top: 5px;
      padding: 4px;
      border: 1px solid #444;
      text-align: center;
    }
    #set-status { margin-top: 6px; color: #aaa; white-space: pre-line; }
    #cloud-line { margin-top: 4px; font-size: 9px; color: #888; text-align: center; }
    canvas {
      display: none;
      background: #9bbc0f;
      image-rendering: -moz-crisp-edges;
      image-rendering: pixelated;
      width: 240px;
      height: 216px;
      outline: none;
    }
    #bar {
      display: none;
      margin-top: 6px;
      font-size: 10px;
      line-height: 1.3;
      color: #aaa;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="menu">
      <div id="menu-title">SELECT GAME</div>
      <div id="game-list"></div>
      <div id="menu-hint">2/8: Move | 1/OK: Play</div>
      <div id="cloud-line"></div>
    </div>
    <div id="settings">
      <div id="menu-title">CLOUD SAVES (GitHub)</div>
      <label for="set-repo">Repo (owner/name)</label>
      <input id="set-repo" type="text" autocapitalize="off" autocomplete="off">
      <label for="set-branch">Branch</label>
      <input id="set-branch" type="text" autocapitalize="off" autocomplete="off">
      <label for="set-token">Token (needs Contents: write)</label>
      <input id="set-token" type="text" autocapitalize="off" autocomplete="off">
      <div class="btn" id="set-save" tabindex="0">Test &amp; Save</div>
      <div class="btn" id="set-clear" tabindex="0">Turn off</div>
      <div class="btn" id="set-back" tabindex="0">Back</div>
      <div id="set-status"></div>
    </div>
    <canvas id="gb" width="160" height="144" tabindex="0"></canvas>
    <div id="bar">Loading...</div>
  </div>

  <!-- terminal.js is NOT used here; these stand in for what the core expects -->
  <script src="js/jio_boot.js"></script>
  <script src="js/other/base64.js"></script>
  <script src="js/other/swfobject.js"></script>
  <script src="js/other/resampler.js"></script>
  <script src="js/other/XAudioServer.js"></script>
  <script src="js/other/resize.js"></script>
  <script src="js/GameBoyCore.js"></script>
  <script src="js/GameBoyIO.js"></script>
  <script src="sync-config.js"></script>
  <script src="js/other/cloudsave.js"></script>
  <script src="js/jio.js"></script>
</body>
</html>
